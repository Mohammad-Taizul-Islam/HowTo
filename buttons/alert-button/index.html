<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alert Buttons</title>
    <style>
        .btn{
            border: none;
            color: #ffff;
            padding: 14px 28px;
            cursor: pointer;
        }

        .success {
            background-color: #04AA6D;
        }

        .success:hover {background-color: #46a049;}
        .info{background-color: #2196a049;}
        .info:hover{background-color: #e68a00;}

        .danger{background-color: #f44336;}
        .danger:hover{background-color: #da190b;}

        .warning{background-color: #ff9800;}
        .warning:hover{background-color: #da190b;}

        .default{background-color: #e7e7e7; color: black;}
        .default:hover{background-color: #ddd;}
    </style>
  </head>


  <body>
    <button type="button"  class="btn success">Success</button>
    <button type="button" class="btn info">Info</button>
    <button type="button" class="btn warning">Warning</button>
    <button type="button" class="btn danger">Danger</button>
    <button type="button" class="btn default">Default</button>
  </body 



</html>
