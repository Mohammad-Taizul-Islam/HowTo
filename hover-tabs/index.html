<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hover Tabs</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="tab">
      <button class="tablinks" onmouseover="openCity(event,'London')">London</button>
      <button class="tablinks" onmouseover="openCity(event,'Paris')">Paris</button>
      <button class="tablinks" onmouseover="openCity(event,'Tokyo')">Tokyo</button>
      <button class="tablinks" onmouseover="openCity(event,'Dhaka')">Dhaka</button>
    </div>

    <div id="London" class="tabcontent">
      <h3>London</h3>
      <p>London is the capital of England</p>
    </div>

    <div id="Paris" class="tabcontent">
      <h3>Paris</h3>
      <p>Paris is the capital of France</p>
    </div>

    <div id="Tokyo" class="tabcontent">
      <h3>Tokyo</h3>
      <p>Tokyo is the capital of Japan</p>
    </div>

    <div id="Dhaka" class="tabcontent">
      <h3>Dhaka</h3>
      <p>Dhaka is the capital of Bangladesh</p>
    </div>

    <script src="main.js"></script>
  </body>
</html>
