<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Top tabs navigation</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="London" class="tabcontent">
      <h3>London</h3>
      <p>London is the capital of the England</p>
    </div>

    <div id="Paris" class="tabcontent">
      <h3>Paris</h3>
      <p>Paris is the capital of the France</p>
    </div>
    <div id="Rome" class="tabcontent">
      <h3>Rome</h3>
      <p>Rome is the capital of the Italy</p>
    </div>
    <div id="Dhaka" class="tabcontent">
      <h3>Dhaka</h3>
      <p>Dhaka is the capital of the Bangladesh</p>
    </div>

    <button class="tablink" onclick="openCity('London',this,'red')" id="defaultOpen">
      London
    </button>
    <button class="tablink" onclick="openCity('Paris',this,'green')">
      Paris
    </button>
    <button class="tablink" onclick="openCity('Rome',this,'blue')">
      Rome
    </button>
    <button class="tablink" onclick="openCity('Dhaka',this,'orange')">
      Dhaka
    </button>

    <script src="main.js"></script>
  </body>
</html>
