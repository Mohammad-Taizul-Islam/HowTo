<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagination</title>
    <style>
    .pagination{
        display: flex;
        justify-content: center;
        list-style: none;
        padding: 0px;
    }


    .pagination li a{
        display: block;
        padding: 8px 12px;
        text-decoration: none;
        border: 1px solid gray;
        color: black;
        margin: 0 4px;
        border-radius: 5px;
    }

    .pagination li a.active{
        background-color: #4CAF50;
        color: white;
    }


    </style>
</head>
<body>
    <h2>A simple Pagination</h2>

    <ul class="pagination">
        <li><a href="#">&laquo;</a></li>
        <li><a href="#">1</a></li>
        <li><a href="#">2</a></li>
        <li><a href="#">3</a></li>
        <li><a href="#">4</a></li>
        <li><a href="#" class="active">5</a></li>
        <li><a href="#">&raquo;</a></li>
    </ul>
</body>
</html>
