<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Full Tabs pages</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <button class="tablink" onclick="openCity('Home',this,'red')" id="defaultOpen">Home</button>
    <button class="tablink" onclick="openCity('News',this,'green')">News</button>
    <button class="tablink" onclick="openCity('Contact',this,'blue')">Contact</button>
    <button class="tablink" onclick="openCity('About',this,'orange')">About</button>

    <div id="Home" class="tabcontent">
        <h3>Home</h3>
        <p>Home is where the heart is ...</p>
    </div>

       <div id="News" class="tabcontent">
        <h3>News</h3>
        <p>Some news this fine day!</p>
    </div>

       <div id="Contact" class="tabcontent">
        <h3>Contact</h3>
        <p>Get is touch, or swing by for a cup of coffee</p>
    </div>

       <div id="About" class="tabcontent">
        <h3>About</h3>
        <p>Who we are and what we do.</p>
    </div>


    <script src="main.js"></script>
  </body>
</html>
